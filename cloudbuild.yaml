steps:
  # 1. Build the multi-stage Docker container image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/challenger-page:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/challenger-page:latest'
      - '.'

  # 2. Push images to Google Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/challenger-page:$COMMIT_SHA']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/challenger-page:latest']

  # 3. Deploy to Google Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'challenger-page'
      - '--image=gcr.io/$PROJECT_ID/challenger-page:$COMMIT_SHA'
      - '--region=us-central1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--port=8080'
      - '--memory=512Mi'
      - '--cpu=1'
      - '--min-instances=0'
      - '--max-instances=10'
      - '--set-env-vars=NODE_ENV=production,GEMINI_MODEL=gemini-3.8-flash'
      - '--set-secrets=GEMINI_API_KEY=GEMINI_API_KEY:latest,OUTSCRAPER_API_KEY=OUTSCRAPER_API_KEY:latest,UPSTASH_REDIS_REST_URL=UPSTASH_REDIS_REST_URL:latest,UPSTASH_REDIS_REST_TOKEN=UPSTASH_REDIS_REST_TOKEN:latest'

images:
  - 'gcr.io/$PROJECT_ID/challenger-page:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/challenger-page:latest'

options:
  logging: CLOUD_LOGGING_ONLY
